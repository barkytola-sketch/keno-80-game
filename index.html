
<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Keno 80</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10091f;color:white;font-family:Arial;text-align:center;padding:18px}
header{background:#261344;padding:20px;border-radius:15px}
h1{color:#d6a4ff;margin:5px}
.balance{color:#5cffae;font-size:22px;font-weight:bold}
#grid{display:grid;grid-template-columns:repeat(8,1fr);gap:7px;margin:20px 0}
.ball{background:#30234b;border:1px solid #68439a;color:white;border-radius:50%;aspect-ratio:1;font-size:15px}
.ball.selected{background:#a34bff}
.ball.won{background:#16a76a}
button{cursor:pointer}
.action{background:#9c43f5;color:white;border:0;padding:13px 20px;border-radius:10px;font-size:16px;margin:5px}
#results{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.result{background:#16a76a;border-radius:50%;padding:10px;width:38px;height:38px}
.panel{background:#201432;padding:15px;border-radius:15px;margin:15px 0}
small{color:#c5b4d8}
</style>
</head>
<body>
<header>
<h1>🎯 KENO 80</h1>
<p>FREE VIRTUAL COINS</p>
<div class="balance">Balance: <span id="balance">10000</span></div>
</header>

<div class="panel">
<p>Select 1–10 numbers</p>
<div id="count">Selected: 0</div>
<div id="grid"></div>
</div>

<div class="panel">
<label>Virtual bet: </label>
<select id="bet">
<option value="10">10 coins</option>
<option value="50">50 coins</option>
<option value="100">100 coins</option>
<option value="500">500 coins</option>
</select>
<br><br>
<button class="action" onclick="clearPick()">Clear</button>
<button class="action" onclick="draw()">PLAY KENO</button>
</div>

<div class="panel">
<h3>Winning numbers</h3>
<div id="results">Waiting for draw...</div>
<p id="message">Choose your numbers to play!</p>
</div>

<div class="panel">
<h3>Game history</h3>
<div id="history">No games yet</div>
</div>

<script>
let balance=10000;
let selected=[];
let history=[];

const grid=document.getElementById("grid");

for(let i=1;i<=80;i++){
 const b=document.createElement("button");
 b.className="ball";
 b.textContent=i;
 b.onclick=()=>pick(i,b);
 grid.appendChild(b);
}

function update(){
 document.getElementById("balance").textContent=balance;
 document.getElementById("count").textContent="Selected: "+selected.length;
}

function pick(n,b){
 if(selected.includes(n)){
  selected=selected.filter(x=>x!==n);
  b.classList.remove("selected");
 }else if(selected.length<10){
  selected.push(n);
  b.classList.add("selected");
 }
 update();
}

function clearPick(){
 selected=[];
 document.querySelectorAll(".ball").forEach(b=>b.classList.remove("selected","won"));
 update();
}

function draw(){
 const bet=Number(document.getElementById("bet").value);
 if(selected.length<1){alert("Select at least one number");return}
 if(balance<bet){alert("Not enough virtual coins");return}
 balance-=bet;

 let numbers=[];
 while(numbers.length<20){
  let n=Math.floor(Math.random()*80)+1;
  if(!numbers.includes(n))numbers.push(n);
 }
 let hits=selected.filter(n=>numbers.includes(n));
 let winnings=hits.length?bet*hits.length:0;
 balance+=winnings;

 document.querySelectorAll(".ball").forEach(b=>{
  let n=Number(b.textContent);
  b.classList.toggle("won",numbers.includes(n));
 });

 document.getElementById("results").innerHTML=
 numbers.sort((a,b)=>a-b).map(n=>`<span class="result">${n}</span>`).join("");

 document.getElementById("message").textContent=
 `You matched ${hits.length} numbers. Virtual winnings: ${winnings} coins.`;

 history.unshift(`Matched ${hits.length} | Bet ${bet} | Won ${winnings}`);
 history=history.slice(0,10);
 document.getElementById("history").innerHTML=history.join("<br>");
 update();
}
update();
</script>
</body>
</html>
