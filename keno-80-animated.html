<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KENO 80</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top,#39205e,#10091c 65%);color:white;font-family:Arial,sans-serif;padding:16px;text-align:center}
header,.panel{background:#211432;border:1px solid #59347b;border-radius:17px;padding:18px;margin-bottom:15px;box-shadow:0 5px 25px #0006}
h1{color:#d7a1ff;font-size:30px;margin:5px}.balance{font-size:23px;color:#61ffad;font-weight:bold}.subtitle{color:#c4addc;font-size:12px}
#grid{display:grid;grid-template-columns:repeat(8,1fr);gap:7px;margin-top:18px}
.ball{border:1px solid #70469b;background:#352449;color:white;border-radius:50%;aspect-ratio:1;font-size:14px;transition:transform .2s,background .2s,box-shadow .2s}
.ball.selected{background:#a83dff;box-shadow:0 0 13px #bd65ff;transform:scale(1.08)}
.ball.won{background:#00b879;border-color:#9affd7;box-shadow:0 0 16px #00ffad;animation:pop .4s ease}
.ball.hit{background:#ffd24c;color:#271500}
@keyframes pop{0%{transform:scale(.5)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
button{cursor:pointer}.action{background:linear-gradient(110deg,#8b35e7,#c052ff);color:white;border:0;padding:13px 18px;border-radius:10px;font-size:15px;font-weight:bold;margin:5px}.action:disabled{opacity:.5}
#results{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;min-height:45px;margin:15px 0}
.result{display:flex;align-items:center;justify-content:center;width:39px;height:39px;border-radius:50%;background:#61319a;border:1px solid #c18aff;font-weight:bold;animation:pop .3s ease}
.result.hit{background:#00b879;color:white;box-shadow:0 0 12px #00ffad}
#status{color:#e6c9ff;min-height:25px}.draw-title{color:#d6a0ff;font-weight:bold}
select{background:#38254d;color:white;padding:11px;border:1px solid #8555ae;border-radius:8px}
#machine{margin:15px auto;width:100px;height:100px;border-radius:50%;border:4px solid #bb78ff;background:radial-gradient(circle,#8d42cf,#26133e);display:flex;align-items:center;justify-content:center;font-size:37px;box-shadow:0 0 25px #a64cff}
#machine.spinning{animation:spin .5s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
#history{font-size:13px;line-height:2;color:#d4c2e8}footer{color:#8d78a5;font-size:11px;padding:12px}
</style>
</head>
<body>
<header>
<h1>🎯 KENO 80</h1><div class="subtitle">PREMIUM VIRTUAL GAME</div>
<p>YOUR VIRTUAL BALANCE</p><div class="balance"><span id="balance">10,000</span> 🪙</div>
</header>
<div class="panel">
<h3>Select Your Numbers</h3><p class="subtitle">Choose between 1 and 10 numbers</p>
<div id="count">Selected: 0</div><div id="grid"></div>
</div>
<div class="panel">
<h3>Place Virtual Bet</h3>
<select id="bet"><option value="10">10 Coins</option><option value="50">50 Coins</option><option value="100">100 Coins</option><option value="500">500 Coins</option></select><br>
<button class="action" onclick="clearPicks()">CLEAR</button>
<button class="action" id="play" onclick="playGame()">🎲 DRAW NOW</button>
</div>
<div class="panel">
<h3 class="draw-title">LIVE KENO DRAW</h3><div id="machine">🎱</div>
<p id="status">Waiting for your game...</p><div id="results"></div><p id="hits"></p>
</div>
<div class="panel"><h3>📜 Game History</h3><div id="history">No games played yet</div></div>
<footer>FREE VIRTUAL COINS ONLY · KENO 80</footer>
<script>
let balance=10000,selected=[],busy=false,history=[],audio=null;
const grid=document.getElementById("grid");
for(let n=1;n<=80;n++){const b=document.createElement("button");b.className="ball";b.textContent=n;b.onclick=()=>pickNumber(n,b);grid.appendChild(b)}
function sound(freq=500,duration=.08){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();const osc=audio.createOscillator(),gain=audio.createGain();osc.frequency.value=freq;osc.connect(gain);gain.connect(audio.destination);gain.gain.setValueAtTime(.08,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);osc.start();osc.stop(audio.currentTime+duration)}catch(e){}}
function update(){document.getElementById("balance").textContent=balance.toLocaleString();document.getElementById("count").textContent="Selected: "+selected.length}
function pickNumber(n,b){if(busy)return;if(selected.includes(n)){selected=selected.filter(x=>x!==n);b.classList.remove("selected")}else if(selected.length<10){selected.push(n);b.classList.add("selected");sound(650)}else{document.getElementById("status").textContent="Maximum 10 numbers allowed!"}update()}
function clearPicks(){if(busy)return;selected=[];document.querySelectorAll(".ball").forEach(b=>b.classList.remove("selected","won","hit"));document.getElementById("results").innerHTML="";document.getElementById("hits").textContent="";document.getElementById("status").textContent="Choose your numbers!";update()}
function animateBalance(target){const start=balance,diff=target-start,duration=700,beginning=performance.now();function frame(now){const p=Math.min((now-beginning)/duration,1);document.getElementById("balance").textContent=Math.round(start+diff*p).toLocaleString();if(p<1)requestAnimationFrame(frame)}balance=target;requestAnimationFrame(frame)}
async function playGame(){if(busy)return;if(selected.length===0){alert("Please select your numbers!");return}const bet=Number(document.getElementById("bet").value);if(balance<bet){alert("Not enough virtual coins!");return}
busy=true;const play=document.getElementById("play");play.disabled=true;animateBalance(balance-bet);
const machine=document.getElementById("machine"),status=document.getElementById("status"),results=document.getElementById("results"),hitsText=document.getElementById("hits");results.innerHTML="";hitsText.textContent="";document.querySelectorAll(".ball").forEach(b=>b.classList.remove("won","hit"));
machine.classList.add("spinning");status.textContent="🎱 Drawing winning numbers...";
let numbers=[];while(numbers.length<20){let n=Math.floor(Math.random()*80)+1;if(!numbers.includes(n))numbers.push(n)}numbers.sort((a,b)=>a-b);
for(let i=0;i<numbers.length;i++){await new Promise(resolve=>setTimeout(resolve,350));const n=numbers[i],isHit=selected.includes(n),span=document.createElement("span");span.className="result"+(isHit?" hit":"");span.textContent=n;results.appendChild(span);const ball=document.querySelectorAll(".ball")[n-1];if(isHit){ball.classList.add("hit");sound(950,.16)}else{ball.classList.add("won");sound(450,.08)}status.textContent=`Drawing ball ${i+1} of 20...`}
machine.classList.remove("spinning");const matched=selected.filter(n=>numbers.includes(n)),winnings=bet*matched.length;animateBalance(balance+winnings);
hitsText.innerHTML=`Matched: <b>${matched.length}</b> · Virtual winnings: <b>${winnings}</b> coins`;
status.textContent=matched.length?"🎉 Draw complete! You matched numbers!":"Draw complete! Try again!";
history.unshift(`Bet ${bet} | Matches ${matched.length} | Won ${winnings}`);history=history.slice(0,10);document.getElementById("history").innerHTML=history.map(x=>`<div>${x}</div>`).join("");update();busy=false;play.disabled=false}
update();
</script>
</body>
</html>
